local_conf_header:
  meta-axelera: |
    CONF_VERSION = "2"
    # Some useful lines you may want to copy to your site.conf for development
    # INHERIT += "rm_work"

    REMOTE_REPOS_PREFIX := "${@bb.utils.contains('USE_GITHUB', '1', 'git://git@github.com/axelera-ai-hub/aisbc.', 'git://gitea@gitea.amarulasolutions.com:38745/axelera/', d)}"
    REMOTE_DRIVER := "${@bb.utils.contains('USE_GITHUB', '1', 'git://git@github.com/axelera-ai-hub/axelera-driver', 'git://gitea@gitea.amarulasolutions.com:38745/axelera/host.pcie-driver.linux', d)}"
    REMOTE_PROTOCOL := "${@bb.utils.contains('USE_GITHUB', '1', 'https', 'ssh', d)}"

    BBMASK += "meta-axelera/recipes-containers/docker/"
    BBMASK += "meta-axelera/meta-voyager/recipes-core/images/dm-verity-image-initramfs.bbappend"

    DISTRO_FEATURES:append = " usrmerge"
    INITRAMFS_IMAGE = "core-image-minimal-initramfs"

    do_deploy[depends] += "core-image-minimal-initramfs:do_image_complete"

    PREFERRED_VERSION_mender = "5.%"
