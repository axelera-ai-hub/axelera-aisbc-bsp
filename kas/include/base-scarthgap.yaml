local_conf_header:
  meta-axelera: |
    CONF_VERSION = "2"
    # Some useful lines you may want to copy to your site.conf for development
    # INHERIT += "rm_work"
    INHERIT += " rockchip-image voyager-factoryimg voyager-dataimg"
    INIT_MANAGER = "systemd"
    IMAGE_INSTALL:append = " android-tools-adbd android-tools-conf-rockchip "
    PREFERRED_PROVIDER_android-tools-conf = "android-tools-conf-rockchip"
    USB_DEBUGGING_ENABLED = "1"
    PACKAGE_CLASSES = "package_deb"
    EXTRA_IMAGE_FEATURES = "debug-tweaks package-management"
    IMAGE_FSTYPES = " ext4 wic wic.gz wic.bmap ext4.gz"
    RK_ROOTDEV_UUID ?= "614e0000-0000-4b53-8000-1d28000054a9"
    REMOTE_REPOS_PREFIX := "${@bb.utils.contains('USE_GITHUB', '1', 'git://git@github.com/axelera-ai-hub/aisbc.', 'git://gitea@gitea.amarulasolutions.com:38745/axelera/', d)}"
    REMOTE_DRIVER := "${@bb.utils.contains('USE_GITHUB', '1', 'git://git@github.com/axelera-ai-hub/axelera-driver', 'git://gitea@gitea.amarulasolutions.com:38745/axelera/host.pcie-driver.linux', d)}"
    REMOTE_PROTOCOL := "${@bb.utils.contains('USE_GITHUB', '1', 'https', 'ssh', d)}"
    PREFERRED_PROVIDER_optee-client = "optee-rockchip"
    # Mend variables
    MEND_URL = "https://saas-eu.whitesourcesoftware.com/"
    MEND_BLACKLIST_PACKAGES = "linux-rockchip refpolicy-targeted"
    GLIBC_GENERATE_LOCALES = "en_US.UTF-8"

  sdk options: |
    # Include the kernel devsrc in the sdk for out of tree kernel and module development.
    TOOLCHAIN_TARGET_TASK:append = "${@'' if d.getVar('PN') == 'buildtools-tarball' else ' kernel-devsrc'}"

  mender: |
    AXE_MENDER_ARTIFACT_SIGN_KEY = "${TOPDIR}/../meta-axelera/recipes-mender/mender-client/files/dev-private.key"
    AXE_MENDER_ARTIFACT_PUBKEY = "${TOPDIR}/../meta-axelera/recipes-mender/mender-client/files/dev-public.key"

    PREFERRED_VERSION_mender = "5.%"
